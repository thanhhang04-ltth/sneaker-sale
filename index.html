<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEPUP SHOES</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }
        header {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }
        header h1 {
            margin: 0;
            font-size: 32px;
        }
        header p {
            margin-top: 8px;
            color: #cccccc;
            font-size: 16px;
        }
        .product {
            width: 90%;
            max-width: 500px;
            margin: 40px auto;
            padding: 25px;
            background-color: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
        }
        .product-image {
            display: block;
            width: 100%;
            max-width: 350px;
            height: 300px;
            object-fit: cover;
            margin: 0 auto 25px auto;
            border-radius: 12px;
        }
        h2 {
            font-size: 25px;
            margin: 15px 0;
        }
        .original-price {
            color: #888;
            text-decoration: line-through;
            font-size: 18px;
            margin: 10px 0;
        }
        .sale-price {
            color: #e53935;
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }
        .discount {
            display: inline-block;
            background-color: #e53935;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            margin: 10px 0;
        }
        .description {
            color: #555;
            line-height: 1.7;
            margin: 20px 0;
        }
        #test-button {
            width: 100%;
            padding: 16px;
            background-color: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        #test-button:hover {
            background-color: #444;
        }
    </style>
</head>
<body>
    <header>
        <h1>STEPUP SHOES</h1>
        <p>Premium Sneakers Collection</p>
    </header>
    <div class="product">
        <img
            class="product-image"
            src="KakaoTalk_20260923_145348777.jpg"
            alt="프리미엄 운동화">
        <h2>프리미엄 운동화</h2>
        <p class="original-price">₩100,000</p>
        <p class="sale-price">₩90,000</p>
        <span class="discount">10% 할인</span>
        <p class="description">
            편안하고 스타일리시한 프리미엄 운동화입니다.<br>
            지금 구매하시면 10% 할인 혜택을 받을 수 있습니다.
        </p>
        <button id="test-button">
            10% 할인
        </button>
    </div>
</body>
</html>
